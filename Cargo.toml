[workspace]
members = [
    "common",
    "contracts/site-contract",
    "delegates/site-delegate",
    "ui",
]
resolver = "2"

[workspace.dependencies]
# Serialization
ciborium = "0.2.2"
serde = { version = "1.0", features = ["derive"] }

# Cryptography
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc", "serde"] }
blake3 = { version = "1.5.3", features = ["serde"] }
bs58 = "0.5.1"

# Utilities
rand = { version = "0.8.5", features = ["getrandom"], default-features = true }
getrandom = { version = "0.2.16", features = ["js"] }
chrono = { version = "0.4", features = ["serde"] }

# Freenet
freenet-scaffold = "0.2.2"
freenet-scaffold-macro = "0.2.2"
freenet-stdlib = { version = "0.8.3", features = ["contract"] }

# Internal
delta-core = { path = "common", package = "delta-core" }

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.release.package."*"]
opt-level = 'z'

# markdown 1.0.0 (the latest release) plus parser fixes that upstream has not
# released (wooorm/markdown-rs GH-22, GH-23, GH-31, GH-79, #206, #263, #267, and
# one more), and an indexed edit map that makes parsing a long document linear
# rather than quadratic in its length. The same branch River pins, one commit
# later. Drop this only once a release contains all of them;
# ui/src/components/markdown_render.rs `malformed_markdown_renders_without_panicking`
# fails if a parser fix is missing.
# https://github.com/freenet/markdown-rs/commits/freenet/panic-fixes
[patch.crates-io]
markdown = { git = "https://github.com/freenet/markdown-rs", rev = "c0646ed72010008a3ea92bf52be43082a09bdd12" }
