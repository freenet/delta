name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # No `with: toolchain:` — `dtolnay/rust-toolchain` honours the
        # rust-toolchain.toml file at the repo root. Pinning lives in
        # one place; CI and local devs run the same rustc, which is
        # what makes the migration-safety check in the next job
        # actually able to compare hashes.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Prove the webapp bundle gate can still refuse
        # The gate itself runs on the publish path (inside `bundle-webapp`,
        # after the tar), where CI cannot reach it without a full dx build and a
        # publish. This proves the gate can REFUSE a bloated bundle and that it
        # is still wired into that path, which is the half that rots silently.
        run: ./scripts/tests/check-webapp-bundle-test.sh

      - name: Check contract builds (WASM)
        run: ./scripts/build-wasm.sh -p site-contract -p site-delegate

      - name: Check UI builds (WASM)
        run: cargo check -p delta-ui --target wasm32-unknown-unknown

  migration-check:
    name: Delegate migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Load-bearing. The gate finds the previous release's WASM by walking
          # this file's git history; the default depth-1 checkout has no history
          # to walk, so the gate would find no predecessor and pass everything.
          # check-migration.sh refuses outright on a shallow clone rather than
          # reporting that silence as safety, so lowering this fails CI loudly
          # instead of quietly disarming it.
          fetch-depth: 0

      - name: Install Rust
        # See note in the `check` job: pin lives in rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@stable

      - name: Install b3sum
        run: cargo install b3sum

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Print toolchain (for diagnostics if hashes mismatch)
        run: rustc --version --verbose

      - name: Prove the migration gate can still refuse
        # Runs before the gate itself: a gate that has lost its ability to
        # refuse would otherwise report "Safe to publish" and be believed.
        run: ./scripts/tests/check-migration-test.sh

      - name: Migration safety gate
        # The single implementation, shared with `cargo make publish-delta`.
        # It rebuilds both WASMs from source, refuses if the committed bytes
        # don't match, and refuses if either WASM's predecessor hash is missing
        # from legacy_delegates.toml / legacy_contracts.toml. Previously this
        # job only did the rebuild half, so a PR that changed a WASM correctly
        # but recorded no migration entry shipped green (delta#46).
        run: ./scripts/check-migration.sh

  pointer-freshness:
    name: pointer records name the committed WASM
    runs-on: ubuntu-latest
    # Delta's contract and delegate re-key on any WASM change. A published
    # pointer that still names the OLD hash is worse than no pointer: an
    # integrator resolves it, gets a confident answer, and derives a dead key.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate compares against the PR's base commit to
          # confirm the version moved and that no record vanished.
          fetch-depth: 0

      - run: command -v b3sum || cargo install b3sum --locked

      # Pinned by revision AND --locked. This tool decides what a record's
      # bytes ARE; a gate whose oracle can change under it is not a gate, and
      # without --locked cargo re-resolves so the installed binary is not the
      # one that was tested.
      - name: Install pointer-record
        run: |
          REV="$(grep -m1 '^POINTER_TOOL_REV=' scripts/check-pointer-freshness.sh \
                 | sed 's/.*:-\([0-9a-f]*\)}.*/\1/')"
          # Reject empty, ANY character that is not lowercase hex, and anything
          # shorter than a short SHA. The previous form was
          # `[0-9a-f]x7 *`, which accepts arbitrary TRAILING text: `abcdef1zzzz`
          # and even `abcdef1 --features evil` passed it. A guard whose comment
          # says "validates the SHAPE" has to actually do that.
          case "$REV" in
            ""|*[!0-9a-f]*) echo "POINTER_TOOL_REV is not lowercase hex: '$REV'"; exit 1 ;;
          esac
          test "${#REV}" -ge 7 || { echo "POINTER_TOOL_REV too short: '$REV'"; exit 1; }
          cargo install --git https://github.com/freenet/freenet-migrate \
            --rev "$REV" --features publish --locked freenet-pointer-contract

      # This workflow runs on pushes to main as well as PRs, and on a push
      # `github.event.pull_request.*` is EMPTY -- passing those through would
      # invoke `--ci "" ""` every time. Two modes, so both events are checked.
      - name: Verify every pointer record (PR)
        if: github.event_name == 'pull_request'
        run: |
          ./scripts/check-pointer-freshness.sh --ci \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Verify every pointer record (push)
        if: github.event_name != 'pull_request'
        run: ./scripts/check-pointer-freshness.sh
