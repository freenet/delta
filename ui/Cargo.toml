[package]
name = "delta-ui"
version.workspace = true
edition.workspace = true

[features]
default = []
example-data = []
no-sync = []

[dependencies]
serde.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
getrandom = { version = "0.2.15", features = ["js", "wasm-bindgen", "js-sys"], default-features = false }

# UI Framework
dioxus = { version = "0.7.3", features = ["web"] }

# Web
web-sys = { version = "0.3.64", features = [
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "History",
    "HtmlDocument",
    "HtmlElement",
    "MessageEvent",
    "HtmlTextAreaElement",
    "Navigator",
    "Window",
    "Storage",
] }
wasm-bindgen = "0.2.104"
gloo-timers = "0.3"
js-sys = "0.3.64"
wasm-bindgen-futures = "0.4.43"
bs58 = "0.5.1"

# Utilities
chrono.workspace = true
ciborium.workspace = true
markdown = "1.0.0-alpha.21"
serde_json = "1.0"
hex = "0.4"

# Freenet
freenet-stdlib = { workspace = true, features = ["net"] }
# Shared contract/delegate upgrade-migration machinery, used for BOTH halves:
#
#   * contracts — the sans-IO `driver` (ProbeDriver / ProbeStateOps /
#     SelectionPolicy::FoldAll), unchanged since 0.3.0 (0.5.0 is breaking for
#     the delegate half ONLY, so this bump does not touch the contract sweep);
#   * delegates — `migrate_delegate_secrets` over the 0.5.0 writer seam
#     (`SuccessorSecretsIo`), which replaced the raw `(key, value)` pair copier.
#     The seam is what Delta NEEDS: `delta:known_sites` is one entry holding the
#     whole site list, so a pair copy either strands the predecessor's sites or
#     deletes the successor's. See ui/src/freenet_api/delegate_migration.rs.
#
# The point of both is that the anti-rollback, never-clobber and
# tombstone-preservation guarantees live in one reviewed, property-tested place
# rather than being re-derived in each app. Pins freenet-stdlib ^0.8.2, which
# unifies with our 0.8.3 so ContractInstanceId/Parameters are the same types.
freenet-migrate = "0.5.0"

# Internal
delta-core.workspace = true

[build-dependencies]
chrono = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# Used to validate delegate_key == BLAKE3(code_hash) at compile time
# so a typo in legacy_delegates.toml fails the build, not the live
# UI rolling out a broken migration table.
blake3 = "1"
