[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.build-tailwind]
description = "Build Tailwind CSS"
command = "npm"
args = ["run", "build:css"]
cwd = "./ui"

[tasks.watch-tailwind]
description = "Watch and rebuild Tailwind CSS"
command = "npm"
args = ["run", "watch:css"]
cwd = "./ui"

[tasks.build-ui]
description = "Build the UI (CSS + WASM)"
dependencies = ["build-tailwind"]
script = '''
cd ui && dx build
# Copy CSS to output since dx doesn't auto-copy style resources
cp ui/assets/styles.css target/dx/delta-ui/debug/web/public/ 2>/dev/null || true
cp ui/assets/main.css target/dx/delta-ui/debug/web/public/ 2>/dev/null || true
'''

[tasks.serve]
description = "Serve the built UI locally"
dependencies = ["build-ui"]
script = '''
echo "Serving at http://127.0.0.1:8083/"
cd target/dx/delta-ui/debug/web/public && python3 -m http.server 8083
'''

[tasks.test]
description = "Run all tests"
command = "cargo"
args = ["test"]

[tasks.clippy]
description = "Run clippy"
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.add-migration]
description = "Record current delegate WASM hash before rebuilding"
script = '''
if [ -z "$1" ] || [ -z "$2" ]; then
    echo "Usage: cargo make add-migration -- VERSION DESCRIPTION"
    echo "Example: cargo make add-migration -- V2 'Before stdlib bump'"
    exit 1
fi
./scripts/add-migration.sh "$1" "$2"
'''

[tasks.sync-wasm]
description = "Rebuild and copy contract/delegate WASMs to committed locations"
script = "./scripts/sync-wasm.sh"

# Delegates to scripts/check-migration.sh rather than reimplementing it. This
# task used to carry its own inline copy that only compared the committed WASM
# against a fresh build, so `cargo make publish-delta` -- the documented publish
# path -- never ran the predecessor check at all and published happily with a
# migration entry missing (delta#46). Keep this a one-line delegation: the gate
# has exactly one implementation, and this is not it.
[tasks.check-migration]
description = "Migration safety gate: committed WASMs match source and their predecessors are recorded"
script = "./scripts/check-migration.sh"

[tasks.test-migration-gate]
description = "Prove the migration gate still refuses an unrecorded predecessor"
script = "./scripts/tests/check-migration-test.sh"

[tasks.test-bundle-gate]
description = "Prove the webapp bundle gate still refuses a bloated bundle"
script = "./scripts/tests/check-webapp-bundle-test.sh"

[tasks.preflight]
description = "Run all checks before publishing"
# test-migration-gate runs BEFORE check-migration: a gate that has lost its
# ability to refuse would otherwise report "Safe to publish" and be believed.
# test-bundle-gate is here for the same reason, but note the asymmetry: only the
# gate's TEST belongs in preflight. The bundle gate itself CANNOT go here --
# preflight runs as a dependency of publish-delta, so the archive does not exist
# yet and a gate placed here would inspect a stale or absent one and pass, which
# is precisely the delta#46 shape. It lives inside bundle-webapp, after the tar.
dependencies = ["test-migration-gate", "test-bundle-gate", "check-migration"]
script = '''
#!/bin/bash
set -euo pipefail
echo "=== Pre-publish checks ==="

echo "Running cargo fmt --check..."
cargo fmt --check || { echo "FAILED: Run cargo fmt first"; exit 1; }

echo "Running cargo clippy..."
cargo clippy --all-targets -- -D warnings 2>&1 || { echo "FAILED: Fix clippy warnings"; exit 1; }

echo "Running tests..."
cargo test 2>&1 || { echo "FAILED: Tests must pass before publish"; exit 1; }

echo "All pre-publish checks passed."
'''

[tasks.bundle-webapp]
description = "Build the release UI and pack it into target/webapp/webapp.tar.xz (no publish)"
# Depends on preflight, not just build-tailwind. This task produces a
# ready-to-sign archive, and before it existed the ONLY route to one was through
# publish-delta, which meant check-migration and cargo test had necessarily run
# first. Splitting the build out for testability must not quietly open a second
# route to a signable artifact that skips both. The cost is nil on the publish
# path, where cargo-make runs preflight once for both tasks.
dependencies = ["build-tailwind", "preflight"]
script = '''
#!/bin/bash
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY:-$PWD}"
[ -f "$ROOT/Makefile.toml" ] || { echo "bundle-webapp must run from the repo root (got: $ROOT)"; exit 1; }
DX_PUBLIC="$ROOT/target/dx/delta-ui/release/web/public"

# dx writes CONTENT-HASHED filenames into public/assets/, so a changed build
# lands beside its predecessor instead of overwriting it, and nothing prunes the
# old one. The tar below packs the whole directory, so without this the bundle
# accumulated a full ~2MB wasm + js pair on every publish, indefinitely (#70).
#
# The whole output directory goes, not just assets/. dx also STAGES the
# unhashed wasm-bindgen output at public/wasm/ before moving it into assets/, so
# an interrupted build leaves a full-size public/wasm/delta-ui_bg.wasm that an
# assets-only clean would leave behind and ship. Everything under here is dx
# output: index.html is regenerated, contracts/*.wasm are re-copied from
# ui/public/contracts/ every build, and styles.css/main.css are copied in below
# after the build. Nothing here is a source of truth.
rm -rf "$DX_PUBLIC"

# Two lines, not `cd ... && dx build`: with `&&`, a failing cd makes the whole
# list return non-zero without `set -e` treating it as a fatal command, so
# execution would fall through to the cp/tar below and fail later, naming the
# wrong thing.
cd "$ROOT/ui"
dx build --release
cd "$ROOT"
cp ui/assets/styles.css "$DX_PUBLIC/"
cp ui/assets/main.css "$DX_PUBLIC/"
mkdir -p "$ROOT/target/webapp"
cd "$DX_PUBLIC"
tar -cJf "$ROOT/target/webapp/webapp.tar.xz" *
cd "$ROOT"
# The publish gate, kept to a one-line delegation so there is exactly one
# implementation. It is called HERE, inline after the tar, rather than as a
# cargo-make dependency of publish-delta: a dependency could be reordered ahead
# of the tar and would then approve a stale archive from an earlier build, which
# is the delta#46 shape. Being in the same script as the tar, under `set -e`,
# makes "the archive the gate approved" and "the archive fdev publishes" the
# same bytes by construction. Do not move this into preflight.
./scripts/check-webapp-bundle.sh target/webapp/webapp.tar.xz
'''

[tasks.publish-delta]
description = "Build, sign, and publish Delta to Freenet"
dependencies = ["build-tailwind", "preflight", "bundle-webapp"]
script = '''
#!/bin/bash
set -e
WCT=$(which web-container-tool 2>/dev/null || echo "/home/ian/code/freenet/river/main/target/native/x86_64-unknown-linux-gnu/release/web-container-tool")
VERSION=$(($(date +%s) / 60))
$WCT sign \
    --input target/webapp/webapp.tar.xz \
    --output target/webapp/webapp.metadata \
    --parameters target/webapp/webapp.parameters \
    --key-file ~/.config/delta/web-container-keys.toml \
    --version $VERSION
fdev publish \
    --code published-contract/web_container_contract.wasm \
    --parameters published-contract/webapp.parameters \
    contract \
    --webapp-archive target/webapp/webapp.tar.xz \
    --webapp-metadata target/webapp/webapp.metadata
'''
